services:
  - type: web
    name: cinenexus
    runtime: node
    plan: free
    region: singapore
    branch: main

    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: GEMINI_API_KEY
        sync: false

      - key: APP_URL
        sync: false

      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false

      - key: TMDB_API_KEY
        sync: false

      - key: CINEMA_PROVIDER_API_KEY
        sync: false

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false
